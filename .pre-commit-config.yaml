# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    # -   id: check-json
    # -   id: check-yaml

-   repo: local
    hooks:
    -   id: ruff
        name: Ruff linter
        entry: uv run ruff check --fix
        language: system
        types: [python]
    -   id: ruff-format
        name: Ruff formatter
        entry: uv run ruff format
        language: system
        types: [python]
    -   id: commit-slice-guard
        name: Check staged changes fit one ODD work unit
        entry: python3 scripts/commit_slice_guard.py
        language: system
        pass_filenames: false
        always_run: true
    -   id: commit-message-guard
        name: Check commit message Work-Unit trailer
        entry: python3 scripts/commit_message_guard.py
        language: system
        stages: [commit-msg]
